name: Release

on:
  workflow_call:
    inputs:
      prerelease:
        description: "Whether this is a prerelease"
        type: boolean
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Explicit two-step strip: ${GITHUB_REF#refs/*/v} silently no-ops on a tag
      # without a v prefix and yields "refs/tags/1.2.3".
      - name: Set env
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Set version
        run: |
          echo $(jq --arg v "${{ env.VERSION }}" '(.version) = $v' package.json) > package.json
          echo "export const VERSION = 'v${{ env.VERSION }}';" > src/version.ts

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      # Auth is npm trusted publishing (OIDC), which is what id-token: write above is for.
      # It has to be configured on npmjs.com for @upstash/blob first, and a trusted publisher
      # cannot be set up for a package that does not exist yet: publish the first version by
      # hand, then every tag after that goes through here.
      - name: Publish prerelease
        if: ${{ inputs.prerelease }}
        run: npm publish --access public --tag=canary --provenance

      - name: Publish stable release
        if: ${{ !inputs.prerelease }}
        run: npm publish --access public --provenance
